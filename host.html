<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="BINGO, BONGO, BANGO! host screen: game clock and Hall of Fame.">
<meta name="theme-color" content="#07040f">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bingo Bongo Host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Bungee&family=Figtree:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen DJ booth for a TV. Left column stacks the clock and scan-to-play; right is the Hall of Fame (BINGO / BONGO / BANGO) matching its height. Shader backdrop, glass panels, neon type */
:root{
  color-scheme:dark;
  --bg:#07040f; --glass:rgba(20,11,42,.64); --line:rgba(255,255,255,.13); --line-hi:rgba(255,255,255,.26);
  --ink:#f7f2ff; --muted:#b9acdf; --dim:#8d80b8;
  --pink:#ff2fb3; --violet:#8b5cff; --cyan:#2ef0ff; --gold:#ffcf3d; --warn:#ff6b6b;
  --hot:linear-gradient(120deg,var(--pink),var(--violet) 55%,var(--cyan));
  --win:linear-gradient(135deg,var(--gold),var(--pink));
  --neon:"Monoton","Bungee",Impact,sans-serif;
  --display:"Bungee",Impact,"Arial Black",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,button,a,input,.name{touch-action:manipulation}
body{background:radial-gradient(120% 80% at 15% 0%,#2a0d4a 0%,transparent 60%),radial-gradient(90% 70% at 100% 40%,#062a3f 0%,transparent 55%),var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.45;margin:0;overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none}
body::after{content:"";position:fixed;inset:-50%;z-index:70;pointer-events:none;opacity:.09;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.wrap{position:relative;z-index:1;max-width:92rem;margin:0 auto;padding-inline:max(16px,2.5vw);padding-block:.6rem .4rem;display:grid;gap:.85rem}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:8px}
.eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);font-weight:700}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 20px 50px -20px rgba(0,0,0,.6)}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem 1rem}
.title{font-family:var(--neon);font-weight:400;font-size:clamp(1.5rem,3vw,2.5rem);line-height:1.05;letter-spacing:.02em;color:#fff;text-shadow:-.04em 0 rgba(255,47,179,.9),.04em 0 rgba(46,240,255,.9),0 0 .4em rgba(139,92,255,.6)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font:800 .88rem var(--body);color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line-hi);border-radius:999px;padding:.5rem 1rem;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s}
.btn:hover{background:rgba(255,255,255,.12);box-shadow:0 0 0 3px rgba(139,92,255,.25)}
.btn:active{transform:translateY(1px) scale(.97)}
.btn.primary{background:var(--hot);border-color:transparent;color:#fff;box-shadow:0 8px 30px -8px rgba(255,47,179,.7)}
.btn.small{font-size:.8rem;padding:.36rem .78rem}
.btn.on{background:#fff;color:#14082b;border-color:#fff}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}

.stage{display:grid;grid-template-columns:minmax(19rem,.85fr) minmax(0,1.6fr);gap:.85rem;align-items:stretch}
@media (max-width:60rem){.stage{grid-template-columns:1fr}}
.left{display:grid;gap:.85rem;min-width:0;align-content:start}
.panel{padding:clamp(.9rem,1.8vw,1.3rem);display:grid;gap:.6rem;align-content:start;min-width:0}

/* clock */
.clock{justify-items:center;text-align:center;padding-block:.9rem}
.ring{position:relative;width:min(16rem,28vh,76vw);aspect-ratio:1;max-width:100%}
body.clean .ring{width:min(21rem,42vh,76vw)}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .trk{fill:none;stroke:rgba(255,255,255,.09);stroke-width:12}
.ring .val{fill:none;stroke:url(#ringGrad);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .3s linear;filter:drop-shadow(0 0 8px rgba(255,47,179,.7))}
.ring .face{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:.25rem}
.time{font-family:var(--neon);font-weight:400;font-size:clamp(2.4rem,7vh,4.4rem);line-height:1;font-variant-numeric:tabular-nums;color:#fff;text-shadow:-.04em 0 rgba(255,47,179,.9),.04em 0 rgba(46,240,255,.9)}
.time.done{font-family:var(--display);color:var(--gold)}
.status{font-weight:800;font-size:clamp(.88rem,1.8vh,1.05rem);color:var(--muted);max-width:12rem}
.ring.late .status{color:var(--gold)}
.presets,.nudge{justify-content:center;gap:.35rem}
.presets .btn,.nudge .btn{min-width:2.9rem}
.custom{justify-content:center;gap:.4rem}
.custom label,.custom .unit{font-weight:800;font-size:.82rem;color:var(--muted)}
.custom input{font:700 .95rem var(--mono);color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line-hi);border-radius:10px;padding:.36rem .5rem;width:5rem;text-align:center}
.custom input:focus{outline:none;border-color:var(--cyan)}
.custom.bad input{border-color:var(--warn)}
body.ticking .presets,body.ticking .custom{display:none}
body:not(.ticking) .nudge{display:none}

/* scan */
.scan{padding:.8rem;display:grid;grid-template-columns:auto minmax(0,1fr);gap:1rem;align-items:center}
.qr{background:#fff;padding:9px;border-radius:14px;width:clamp(116px,17vh,150px);aspect-ratio:1;display:grid;place-items:center;box-shadow:0 0 0 3px rgba(255,47,179,.5),0 0 30px rgba(46,240,255,.35);color:#14082b;font-weight:700;font-size:.8rem;text-align:center}
.qr img,.qr canvas{display:block;width:100%!important;height:auto!important}
.scan-text{display:grid;gap:.35rem;min-width:0}
.scan-text h2{font-family:var(--display);font-weight:400;font-size:clamp(1.2rem,2.2vw,1.55rem);line-height:1.05}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.3rem}
.rules li{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:.2rem .6rem;font-weight:700;font-size:.78rem}
.urltext{font-family:var(--mono);font-size:.72rem;color:var(--dim);overflow-wrap:anywhere}
body:not(.clean) .urltext{display:none}
.linkrow{display:flex;gap:.4rem;flex-wrap:nowrap}
.linkrow input{font:600 .78rem var(--mono);color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line-hi);border-radius:10px;padding:.38rem .6rem;flex:1 1 auto;width:0}

/* board */
.board{display:flex;flex-direction:column;gap:.8rem;height:0;min-height:100%;overflow:hidden;padding:clamp(.9rem,1.8vw,1.3rem)}
@media (max-width:60rem){.board{height:auto;min-height:0;overflow:visible}}
.boardhead{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.boardhead h2{font-family:var(--display);font-weight:400;font-size:clamp(1.5rem,2.8vw,2.2rem);line-height:1;text-shadow:-.04em 0 rgba(255,47,179,.8),.04em 0 rgba(46,240,255,.8)}
.pill{font:800 .76rem var(--mono);letter-spacing:.08em;text-transform:uppercase;background:var(--win);color:#2a0730;border-radius:999px;padding:.32rem .75rem}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem;flex:1 1 auto;min-height:0}
@media (max-width:40rem){.cols{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;min-height:0;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:18px;padding:.65rem;gap:.5rem}
.col h3{display:flex;align-items:baseline;gap:.45rem;font-family:var(--display);font-weight:400;font-size:1.05rem;letter-spacing:.02em}
.col h3 .tag{font:700 .64rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.col h3 .count{margin-left:auto;font:800 .78rem var(--mono);background:rgba(255,255,255,.08);border-radius:999px;padding:.1rem .5rem;color:var(--ink)}
.colB h3{color:var(--pink)}.colO h3{color:var(--cyan)}.colF h3{color:var(--gold)}
.list{list-style:none;margin:0;padding:0 2px 0 0;display:grid;gap:.38rem;align-content:start;flex:1 1 auto;min-height:0;overflow:auto;scrollbar-width:thin}
@media (max-width:60rem){.list{max-height:20rem}}
.list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:.5rem;align-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:.45rem .6rem}
.list li.fresh{animation:slidein .5s cubic-bezier(.2,1.4,.4,1)}
.colB .list li:first-child{background:linear-gradient(120deg,rgba(255,47,179,.35),rgba(139,92,255,.2));border-color:rgba(255,47,179,.6)}
.colO .list li:first-child{background:linear-gradient(120deg,rgba(46,240,255,.28),rgba(139,92,255,.2));border-color:rgba(46,240,255,.6)}
.colF .list li:first-child{background:linear-gradient(120deg,rgba(255,207,61,.32),rgba(255,47,179,.2));border-color:rgba(255,207,61,.65)}
.pos{font-family:var(--display);font-size:.95rem;color:var(--muted);min-width:2.1rem}
.list li:first-child .pos{color:#fff}
.nm{font-weight:900;font-size:clamp(.95rem,1.55vw,1.25rem);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.at{font-family:var(--mono);font-size:.7rem;color:var(--dim);font-variant-numeric:tabular-nums}
.x{border:0;background:transparent;color:var(--dim);font-size:1.15rem;line-height:1;cursor:pointer;padding:.2rem .4rem;border-radius:8px;min-width:30px;min-height:30px}
.x:hover{color:var(--warn)}
.empty{display:grid!important;place-items:center;align-content:center;gap:.3rem;text-align:center;min-height:6rem;height:100%;color:var(--dim);font-weight:700;border:1px dashed var(--line-hi)!important;background:transparent!important;grid-template-columns:none!important}
.empty::before{content:attr(data-icon);font-size:1.7rem;line-height:1}

/* logging */
.log{display:grid;gap:.55rem;padding-top:.75rem;border-top:1px dashed var(--line-hi);margin-top:auto}
.seg{display:inline-grid;grid-auto-flow:column;background:rgba(255,255,255,.06);border:1px solid var(--line-hi);border-radius:999px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;font:400 .82rem var(--display);letter-spacing:.03em;color:var(--muted);padding:.42rem .85rem;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{color:#14082b}
#modeB[aria-pressed="true"]{background:var(--pink);color:#fff}
#modeO[aria-pressed="true"]{background:var(--cyan)}
#modeF[aria-pressed="true"]{background:var(--gold)}
.search{font:600 .92rem var(--body);color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line-hi);border-radius:12px;padding:.48rem .75rem;flex:1 1 9rem;min-width:0}
.search::placeholder{color:var(--dim)}
.search:focus{outline:none;border-color:var(--cyan)}
.namegrid{display:flex;flex-wrap:wrap;gap:.38rem}
.name{font:800 .9rem var(--body);color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line-hi);border-radius:999px;padding:.42rem .82rem;cursor:pointer;min-height:38px;transition:transform .12s,background .12s,box-shadow .2s}
.name:hover{background:rgba(139,92,255,.25);box-shadow:0 0 0 3px rgba(139,92,255,.22)}
.name:active{transform:scale(.95)}
.name small{font:700 .66rem var(--mono);color:var(--gold);margin-left:.3rem}
.hint{color:var(--dim);font-size:.82rem}
body.clean .ctl{display:none!important}

/* celebration */
.cele{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(3,1,8,.72)}
.cele .box{position:relative;background:rgba(18,10,38,.94);border-radius:34px;padding:clamp(1.6rem,6vw,3rem);text-align:center;display:grid;gap:.5rem;max-width:44rem;width:100%;overflow:hidden}
.cele .box::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;padding:3px;background:var(--hot);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.cele .big{font-family:var(--neon);font-weight:400;font-size:clamp(3.4rem,13vw,8rem);line-height:1;color:#fff;text-shadow:-.05em 0 rgba(255,47,179,.95),.05em 0 rgba(46,240,255,.95),0 0 .4em rgba(255,207,61,.6)}
.cele .who{font-family:var(--display);font-weight:400;font-size:clamp(2rem,7vw,3.6rem);line-height:1.05}
.cele .sub{color:var(--muted);font-weight:800;font-size:1.1rem}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:no-preference){
  .cele .box{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
  .ring.late .time{animation:beat 1s ease-in-out infinite}
  .title{animation:glitch 5s steps(1) infinite}
}
@keyframes pop{from{transform:scale(.85) rotate(-2deg)}to{transform:none}}
@keyframes slidein{from{transform:translateX(18px) scale(.97);opacity:.2}to{transform:none;opacity:1}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes glitch{0%,93%,100%{transform:none}94%{transform:translateX(-2px) skewX(-4deg)}96%{transform:translateX(2px)}}
</style>
</head>
<body>


<canvas id="fx" aria-hidden="true"></canvas>

<div class="wrap">
  <header class="top">
    <div><p class="eyebrow">Host screen</p><h1 class="title">BINGO, BONGO, BANGO!</h1></div>
    <div class="row">
      <button class="btn small" id="soundBtn" type="button" aria-pressed="true">Sound on</button>
      <button class="btn small" id="cleanBtn" type="button" aria-pressed="false">Hide controls</button>
      <button class="btn small ctl" id="fsBtn" type="button">Full screen</button>
    </div>
  </header>

  <div class="stage">
    <div class="left">
      <section class="panel clock glass" aria-label="Game clock">
        <div class="ring" id="ring">
          <svg viewBox="0 0 200 200" aria-hidden="true"><defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2fb3"/><stop offset=".55" stop-color="#8b5cff"/><stop offset="1" stop-color="#2ef0ff"/></linearGradient></defs><circle class="trk" cx="100" cy="100" r="88"/><circle class="val" id="ringVal" cx="100" cy="100" r="88" stroke-dasharray="552.92" stroke-dashoffset="0"/></svg>
          <div class="face"><div class="time" id="time" aria-live="polite">20:00</div><div class="status" id="status">Ready.</div></div>
        </div>
        <div class="row ctl presets" role="group" aria-label="Game length">
          <button class="btn small len" type="button" data-min="5" aria-pressed="false">5</button>
          <button class="btn small len" type="button" data-min="10" aria-pressed="false">10</button>
          <button class="btn small len" type="button" data-min="15" aria-pressed="false">15</button>
          <button class="btn small len on" type="button" data-min="20" aria-pressed="true">20</button>
          <button class="btn small len" type="button" data-min="25" aria-pressed="false">25</button>
          <button class="btn small len" type="button" data-min="30" aria-pressed="false">30 min</button>
        </div>
        <form class="row ctl custom" id="customForm" novalidate>
          <label for="customMin">Custom</label>
          <input id="customMin" type="number" inputmode="decimal" min="0.5" max="180" step="0.5" placeholder="12">
          <span class="unit">min</span>
          <button class="btn small" type="submit">Set</button>
        </form>
        <div class="row ctl nudge" role="group" aria-label="Adjust time">
          <button class="btn small" type="button" data-adj="-60">−1 min</button>
          <button class="btn small" type="button" data-adj="-30">−30 s</button>
          <button class="btn small" type="button" data-adj="30">+30 s</button>
          <button class="btn small" type="button" data-adj="60">+1 min</button>
        </div>
        <div class="row ctl">
          <button class="btn primary" id="goBtn" type="button">Start</button>
          <button class="btn" id="resetBtn" type="button">Reset</button>
        </div>
      </section>

      <section class="scan glass" aria-label="How to join">
        <div class="qr" id="qr" aria-label="QR code for the player card"></div>
        <div class="scan-text">
          <h2>Scan to play</h2>
          <ul class="rules"><li>Find a match</li><li>Tap their name</li><li>Max 2 each</li><li>Line = BINGO</li></ul>
          <p class="urltext" id="urltext"></p>
          <div class="linkrow ctl">
            <input id="link" type="url" aria-label="Player card link" placeholder="Player card link">
            <button class="btn small" id="linkBtn" type="button">Update QR</button>
          </div>
        </div>
      </section>
    </div>

    <section class="board glass" aria-label="Hall of Fame">
      <div class="boardhead"><h2>Hall of Fame</h2><span class="pill" id="total">0 legends</span></div>
      <div class="cols">
        <div class="col colB"><h3>BINGO! <span class="tag">1 line</span><span class="count" id="countB">0</span></h3><ol class="list" id="listB"></ol></div>
        <div class="col colO"><h3>BONGO! <span class="tag">2 lines</span><span class="count" id="countO">0</span></h3><ol class="list" id="listO"></ol></div>
        <div class="col colF"><h3>BANGO! <span class="tag">full card</span><span class="count" id="countF">0</span></h3><ol class="list" id="listF"></ol></div>
      </div>
      <div class="log ctl">
        <div class="row" style="justify-content:space-between">
          <div class="seg" role="group" aria-label="What are you logging?">
            <button type="button" id="modeB" aria-pressed="true">BINGO</button>
            <button type="button" id="modeO" aria-pressed="false">BONGO</button>
            <button type="button" id="modeF" aria-pressed="false">BANGO</button>
          </div>
          <input class="search" id="find" type="search" autocomplete="off" placeholder="Filter names" aria-label="Filter names">
        </div>
        <div class="namegrid" id="names"></div>
        <div class="row" style="justify-content:space-between">
          <p class="hint" id="hint">Tap a name to log a BINGO. × to undo.</p>
          <button class="btn small" id="clearAll" type="button">Clear board</button>
        </div>
      </div>
    </section>
  </div>
</div>

<div class="cele" id="cele" hidden>
  <div class="box" role="alert"><div class="big" id="celeBig">BINGO!</div><div class="who" id="celeWho"></div><div class="sub" id="celeSub"></div></div>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* Disco shader backdrop: domain-warped gradient, grain, chromatic split. Low-res, 30fps, pauses when hidden */
(function(){
  var c=document.getElementById('fx'),gl=c.getContext&&(c.getContext('webgl',{antialias:false,alpha:false})||c.getContext('experimental-webgl'));
  if(!gl){c.remove();return}
  var vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  var fs='precision mediump float;uniform vec2 r;uniform float t;'+
  'float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}'+
  'float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}'+
  'float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*n(p);p*=2.03;a*=.5;}return v;}'+
  'vec3 pal(float x){return vec3(.55,.25,.6)+vec3(.45,.35,.4)*cos(6.2831*(x+vec3(0.,.33,.67)));}'+
  'vec3 sc(vec2 uv){vec2 p=uv*vec2(r.x/r.y,1.)*1.7;float q=fbm(p+vec2(t*.045,-t*.035));float w=fbm(p*1.25+q*2.2+vec2(-t*.03,t*.05));'+
  'vec3 col=pal(w*1.15+t*.015);col*=smoothstep(.38,.95,w)*.95+.03;float v=smoothstep(1.25,.15,length(uv-vec2(.5,.45))*1.35);return col*v*.85;}'+
